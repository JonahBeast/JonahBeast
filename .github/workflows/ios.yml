# App de iPhone: comprueba en una Mac de GitHub que el proyecto de Xcode
# (carpeta ios/) se arma sin errores. Solo corre cuando cambia algo de la
# app de iPhone, para no gastar minutos de Mac. La firma y la subida a
# TestFlight se agregan cuando esté lista la cuenta de Apple.
name: App de iPhone

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - 'capacitor.config.json'
      - 'ios-web/**'
      - '.github/workflows/ios.yml'

jobs:
  armar:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx cap sync ios
      - name: Armar para el simulador (sin firma)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          exit ${PIPESTATUS[0]}
