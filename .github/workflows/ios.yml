# App de iPhone: comprueba en una Mac de GitHub que el proyecto de Xcode
# (carpeta ios/) se arma sin errores. Solo corre cuando cambia algo de la
# app de iPhone, para no gastar minutos de Mac.
# Para subir una versión de prueba a TestFlight: Actions → "App de iPhone"
# → Run workflow → marcar "Subir a TestFlight". Firma con la llave de App
# Store Connect guardada en los secretos del repositorio
# (APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_KEY).
name: App de iPhone

on:
  workflow_dispatch:
    inputs:
      subir:
        description: 'Subir a TestFlight'
        type: boolean
        default: false
  push:
    paths:
      - 'ios/**'
      - 'capacitor.config.json'
      - 'ios-web/**'
      - '.github/workflows/ios.yml'

jobs:
  armar:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx cap sync ios
      - name: Armar para el simulador (sin firma)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          exit ${PIPESTATUS[0]}

  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.subir
    runs-on: macos-15
    timeout-minutes: 45
    env:
      EQUIPO: 9729PY2S83
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Apple pide armar con el Xcode más nuevo: se usa el último instalado.
      - name: Elegir el Xcode más nuevo
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - run: npm install --no-audit --no-fund
      - run: npx cap sync ios
      - name: Llave de App Store Connect
        env:
          LLAVE: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          printf '%s\n' "$LLAVE" > "$RUNNER_TEMP/AuthKey.p8"
          echo "LLAVE_P8=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      # Se arma sin firmar (la firma de desarrollo pide un iPhone
      # registrado) y luego se le pone una firma local solo para guardar
      # los permisos de App.entitlements (Continuar con Apple y avisos).
      # La firma de tienda la pone el paso de subir: Apple crea el
      # certificado y el perfil que falten con la llave y conserva esos
      # permisos. El número de versión interno sube solo en cada envío.
      - name: Armar la app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$LLAVE_P8" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            DEVELOPMENT_TEAM=$EQUIPO CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive | tail -60
          exit ${PIPESTATUS[0]}
      - name: Comprobar los permisos de la app
        run: |
          codesign --force --sign - --timestamp=none \
            --entitlements ios/App/App/App.entitlements \
            "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          codesign -d --entitlements - "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" 2>/dev/null | tee "$RUNNER_TEMP/permisos.txt"
          grep -q "com.apple.developer.applesignin" "$RUNNER_TEMP/permisos.txt" || { echo "::error::La app no lleva el permiso de Continuar con Apple"; exit 1; }
          grep -q "aps-environment" "$RUNNER_TEMP/permisos.txt" || { echo "::error::La app no lleva el permiso de avisos"; exit 1; }
      - name: Subir a TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$EQUIPO</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/salida" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$LLAVE_P8" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" | tail -60
          exit ${PIPESTATUS[0]}
      - name: Borrar la llave
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
