<!doctype html><html lang="es"><head><meta charset="utf-8">
<!-- Colección de polos Jonah Beast Fuel. Uso: arte-coleccion.html?d=1&pieza=espalda&polo=negro
     1 px CSS = 3 px reales (deviceScaleFactor 3) -> 300 dpi (1 cm = 39,37 px CSS).
     REGLA: el gorila es SIEMPRE el logo original (public/logo-marca.webp) entero, sin cambios; solo se escala.
     gorila-x8.png es ese mismo logo agrandado 8 veces (por eso las piezas con gorila son _BORRADOR). -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--carbon:#16110D;--aji:#E8590C;--crema:#F7F2E7}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
body{font-family:'Work Sans',sans-serif}
body.negro{--ink:var(--crema)} body.crema{--ink:var(--carbon)}
.anton{font-family:'Anton',sans-serif;text-transform:uppercase;line-height:.9;white-space:nowrap}
#pieza{position:relative;display:inline-block;vertical-align:top}
.c{text-align:center}
.ws{font-weight:800;text-transform:uppercase;white-space:nowrap;display:inline-block}
.logo{display:block;margin:0 auto}
/* D1: filas que se llenan */
.fila{position:relative;text-align:center;line-height:.86}
.fila span{display:inline-block}
.fila .o{color:transparent;-webkit-text-stroke:5px var(--ink)}
.fila .f{position:absolute;top:0;left:50%;transform:translateX(-50%);color:var(--aji)}
.regla{height:6px;background:var(--aji);margin:0 auto}
.nuca{display:flex;align-items:center;gap:10px;height:40px;padding:0 3px}
.nuca b{width:8px;height:8px;border-radius:50%;background:var(--aji);flex:none}
.nuca span{font-size:30px;color:var(--ink);line-height:1}
</style></head><body>
<div id="pieza"></div>
<script>
const q=new URLSearchParams(location.search);
const D=q.get('d')||'1',PZ=q.get('pieza')||'espalda',POLO=q.get('polo')||'negro';
document.body.className=POLO;
const R=document.getElementById('pieza');
const LOGO='../../fuente/gorila-x8.png'; // logo-marca.webp original, entero, agrandado x8
const fitW=(el,w)=>{const cur=parseFloat(getComputedStyle(el).fontSize);el.style.fontSize=(cur*w/el.getBoundingClientRect().width)+'px';};
const logo=(w)=>`<img class="logo" src="${LOGO}" style="width:${w}px;height:${w*480/400}px">`;
const FRASE='Sigue comiendo peruano. Esta vez, con resultados.';

// ---------- Diseño 1: "COMIDA A COMIDA" como barra que se llena ----------
function d1espalda(){
  const W=1260,filas=7;let h=`<div style="width:${W}px"><div class="c" style="margin-bottom:26px"><span class="ws" id="k" style="font-size:30px;letter-spacing:.5em;padding-left:.5em;color:var(--aji)">Jonah Beast Fuel</span></div>`;
  for(let i=0;i<filas;i++){const pct=Math.round(100*i/(filas-1));
    h+=`<div class="fila anton"><span class="o">Comida a comida</span><span class="f" style="clip-path:inset(0 ${100-pct}% 0 0)">Comida a comida</span></div>`;}
  h+=`<div class="regla" style="width:${W-8}px;margin-top:34px;margin-bottom:24px"></div><div class="c"><span class="ws" id="u" style="font-size:34px;letter-spacing:.4em;padding-left:.4em;color:var(--ink)">jonahbeast.com</span></div></div>`;
  R.innerHTML=h;
  R.querySelectorAll('.fila').forEach(f=>{const s=f.querySelector('.o');s.style.fontSize='200px';const k=1252/s.getBoundingClientRect().width;f.style.fontSize=(200*k)+'px';s.style.fontSize='';});
}
function d1frente(){R.innerHTML=logo(256);} // logo chico en el pecho (6,5 cm)

// ---------- Diseño 2: logo grande en la espalda ----------
function d2espalda(){
  const W=1220;
  R.innerHTML=`<div style="width:${W}px" class="c"><div class="anton" id="t" style="font-size:200px;color:var(--ink);display:inline-block">Jonah Beast <span style="color:var(--aji)">Fuel</span></div>
   <div style="margin:34px 0 26px">${logo(1000)}</div>
   <span class="ws" id="fr" style="font-weight:700;font-size:30px;letter-spacing:.12em;color:var(--ink)">${FRASE}</span></div>`;
  fitW(R.querySelector('#t'),W-6);fitW(R.querySelector('#fr'),W-40);
}
function d2frente(){
  R.innerHTML=`<div class="anton" id="t" style="font-size:120px;color:var(--ink);display:inline-block;padding:2px">Jonah Beast <span style="color:var(--aji)">Fuel</span></div>`;
  fitW(R.querySelector('#t'),866); // 22 cm
}

// ---------- Diseño 3: logo grande al frente, espalda discreta ----------
function d3frente(){
  const W=945;
  R.innerHTML=`<div style="width:${W}px" class="c">${logo(W)}<div class="anton" id="t" style="font-size:150px;color:var(--ink);display:inline-block;margin-top:30px">Comida a <span style="color:var(--aji)">comida</span></div></div>`;
  fitW(R.querySelector('#t'),W-6);
}
function d3espalda(){
  const W=787;
  R.innerHTML=`<div style="width:${W}px" class="c"><div><span class="ws" id="a" style="font-size:40px;letter-spacing:.06em;color:var(--ink)">Sigue comiendo peruano.</span></div>
   <div style="margin-top:8px"><span class="ws" id="b" style="font-size:40px;letter-spacing:.06em;color:var(--ink)">Esta vez, con resultados.</span></div>
   <div class="regla" style="width:120px;margin:26px auto 22px"></div>
   <span class="ws" id="u" style="font-size:30px;letter-spacing:.42em;padding-left:.42em;color:var(--aji)">jonahbeast.com</span></div>`;
  fitW(R.querySelector('#a'),W-10);fitW(R.querySelector('#b'),W-10);
}
function nuca(txt){R.innerHTML=`<div class="nuca"><b></b><span class="anton">${txt}</span><b></b></div>`;fitW(R.querySelector('span'),236);}

const piezas={'1':{espalda:d1espalda,frente:d1frente,nuca:()=>nuca('Jonah Beast Fuel')},
 '2':{espalda:d2espalda,frente:d2frente,nuca:()=>nuca('Comida a comida')},
 '3':{espalda:d3espalda,frente:d3frente,nuca:()=>nuca('Jonah Beast Fuel')}};
document.fonts.load('100px Anton').then(()=>document.fonts.load('800 20px "Work Sans"')).then(()=>document.fonts.load('700 20px "Work Sans"')).then(()=>document.fonts.ready).then(()=>{
  piezas[D][PZ]();
  return Promise.all([...R.querySelectorAll('img')].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r})));
}).then(()=>{const b=R.getBoundingClientRect();document.body.dataset.w=Math.ceil(b.width);document.body.dataset.h=Math.ceil(b.height);document.body.dataset.listo=1;});
</script></body></html>
