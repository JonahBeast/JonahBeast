<!doctype html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--carbon:#16110D;--aji:#E8590C;--brillo:#FF7020;--crema:#F7F2E7}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
body{font-family:'Work Sans',sans-serif}
.anton{font-family:'Anton',sans-serif;text-transform:uppercase;line-height:.9}
.pieza{position:relative;display:none}
body.negro{--txt:var(--crema)} body.crema{--txt:var(--carbon)}
/* ===== ESPALDA 31 x 42 cm  (1 css px = 3 px a 300 dpi) ===== */
#espalda{width:1220px;height:1700px}
#espalda .kicker{position:absolute;top:0;left:0;right:0;text-align:center;font-weight:800;letter-spacing:.42em;font-size:27px;color:var(--aji);text-transform:uppercase;padding-left:.42em}
#espalda .fuel{position:absolute;top:44px;left:0;right:0;text-align:center;font-size:560px;color:transparent;-webkit-text-stroke:9px var(--aji);letter-spacing:.01em}
#espalda .brillo{position:absolute;left:50%;top:330px;width:1180px;height:1180px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(255,112,32,.62) 0%,rgba(232,89,12,.36) 30%,rgba(232,89,12,.12) 52%,rgba(232,89,12,0) 68%)}
#espalda .gorila{position:absolute;left:50%;top:300px;width:930px;transform:translateX(-50%)}
#espalda .abajo{position:absolute;left:0;right:0;top:1410px;text-align:center}
#espalda .lema{color:var(--txt);white-space:nowrap;display:inline-block}
#espalda .linea{display:flex;align-items:center;gap:22px;justify-content:center;margin:20px 0 14px}
#espalda .linea i{height:5px;background:var(--aji);flex:1}
#espalda .frase{font-weight:700;color:var(--txt);text-transform:uppercase;letter-spacing:.14em;white-space:nowrap;font-size:28px;padding:0 4px}
#espalda .url{margin-top:14px;font-weight:700;color:var(--aji);letter-spacing:.35em;font-size:20px;padding-left:.35em}
/* ===== FRENTE PECHO 9,5 cm ===== */
#frente{width:374px;height:190px;display:none;align-items:center;gap:12px}
#frente .g{height:190px;width:auto;flex:none}
#frente .t1{font-size:60px;color:var(--txt);white-space:nowrap}
#frente .t2{font-size:60px;color:var(--aji);white-space:nowrap}
#frente .t3{font-weight:800;font-size:11.5px;letter-spacing:.32em;color:var(--txt);margin-top:9px;white-space:nowrap}
/* ===== NUCA 7 cm ===== */
#nuca{width:276px;height:48px;display:none;align-items:center;justify-content:center;gap:10px}
#nuca span{font-size:34px;color:var(--txt);white-space:nowrap;letter-spacing:.04em}
#nuca b{width:8px;height:8px;border-radius:50%;background:var(--aji);flex:none}
/* ===== MANGA 8 cm ===== */
#manga{width:315px;height:56px;display:none;align-items:center;justify-content:center}
#manga span{font-size:46px;color:var(--aji);white-space:nowrap;letter-spacing:.03em}
</style></head><body>
<div id="espalda" class="pieza">
  <div class="kicker">Jonah Beast Fuel · Hecho en Perú</div>
  <div class="fuel anton">FUEL</div>
  <div class="brillo"></div>
  <img class="gorila" src="gorila-x8.png">
  <div class="abajo">
    <div class="lema anton" id="lema">Comida a comida</div>
    <div class="linea"><i></i><div class="frase" id="frase">Sigue comiendo peruano. Esta vez, con resultados.</div><i></i></div>
    <div class="url">JONAHBEAST.COM</div>
  </div>
</div>
<div id="frente" class="pieza">
  <img class="g" src="gorila-x8.png">
  <div><div class="anton t1">JONAH BEAST</div><div class="anton t2">FUEL</div><div class="t3">COMIDA A COMIDA</div></div>
</div>
<div id="nuca" class="pieza"><b></b><span class="anton">JONAH BEAST FUEL</span><b></b></div>
<div id="manga" class="pieza"><span class="anton">COMIDA A COMIDA</span></div>
<script>
const p=new URLSearchParams(location.search);
document.body.className=p.get('polo')||'negro';
const el=document.getElementById(p.get('pieza')||'espalda');
el.style.display=el.id==='espalda'?'block':'flex';
if(p.get('brillo')==='0')document.querySelector('.brillo').style.display='none';
document.fonts.ready.then(()=>{
  const L=document.getElementById('lema');let fs=100;L.style.fontSize=fs+'px';
  fs=fs*1200/L.getBoundingClientRect().width;L.style.fontSize=fs+'px';
  const F=document.getElementById('frase');
  // fit the phrase line
  const tf=document.getElementById('frente');
  if(el.id==='frente'){const t1=tf.querySelector('.t1'),avail=374-12-tf.querySelector('.g').getBoundingClientRect().width;
    const k=avail/t1.getBoundingClientRect().width;t1.style.fontSize=(60*k)+'px';tf.querySelector('.t2').style.fontSize=(60*k*1.25)+'px';
    const t3=tf.querySelector('.t3');t3.style.fontSize=(11.5*avail/t3.getBoundingClientRect().width)+'px';}
  if(el.id==='nuca'||el.id==='manga'){const sp=el.querySelector('span');const dots=el.id==='nuca'?2*(8+10):0;
    const k=(el.clientWidth-6-dots)/sp.getBoundingClientRect().width;sp.style.fontSize=(parseFloat(getComputedStyle(sp).fontSize)*k)+'px';}
  document.body.dataset.listo=1;
});
</script></body></html>
