<!doctype html><html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(anton.woff2) format('woff2')}
@font-face{font-family:WS;src:url(worksans.woff2) format('woff2');font-weight:800}
*{margin:0;padding:0;box-sizing:border-box}
body{width:2000px;height:1300px;background:radial-gradient(ellipse at 30% 50%,#E6DFD1 0%,#CFC6B6 100%);font-family:WS,sans-serif;position:relative;overflow:hidden;color:#16110D}
.tit{position:absolute;top:34px;left:56px;font-family:Anton;font-size:58px;text-transform:uppercase;letter-spacing:.01em;line-height:1}
.tit b{color:#E8590C;font-weight:400}
.sub{position:absolute;top:104px;left:58px;font-weight:800;font-size:19px;letter-spacing:.2em;color:#5b5045;text-transform:uppercase}
#frente{position:absolute;left:20px;top:150px}
.panel{position:absolute;left:1150px;width:800px;height:500px;border-radius:22px;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.22);background:#d6cebf}
.panel svg{display:block}
.cap{position:absolute;left:1152px;font-weight:800;font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:#3b3229}
.cap span{color:#E8590C}
.hilos{position:absolute;left:58px;bottom:34px;display:flex;gap:26px;align-items:center;font-weight:800;font-size:17px;letter-spacing:.12em;text-transform:uppercase;color:#3b3229}
.hilos i{display:inline-block;width:26px;height:26px;border-radius:50%;vertical-align:middle;margin-right:9px;border:2px solid rgba(0,0,0,.25)}
.marca{position:absolute;top:58px;right:52px;font-weight:800;font-size:15px;letter-spacing:.3em;color:#7a6e60}
</style><script src="medidas.js"></script></head><body>
<div class="tit" id="tit"></div><div class="sub" id="sub"></div>
<svg id="frente" width="1100" height="1100"></svg>
<div class="panel" style="top:150px"><svg id="d1" width="800" height="500"></svg></div>
<div class="cap" id="c1" style="top:662px"></div>
<div class="panel" style="top:715px"><svg id="d2" width="800" height="500"></svg></div>
<div class="cap" id="c2" style="top:1227px"></div>
<div class="hilos" id="hilos"></div>
<script>
const q=new URLSearchParams(location.search), D=+(q.get('d')||1), polo=q.get('polo')||'carbon';
const B='../bordado/';
const TELAS={
 carbon:{tela:'#211B16',sombra:'#000',luz:'#5a4e44',int:'#0d0a08',btn:'#2c2520',costura:'#3d352e',nombre:'carbón'},
 crema:{tela:'#EEE6D4',sombra:'#6f624f',luz:'#ffffff',int:'#cbc1ac',btn:'#f6f1e6',costura:'#c8bda7',nombre:'crema / hueso'},
 naranja:{tela:'#DD550E',sombra:'#5a1d00',luz:'#ffa060',int:'#a63c05',btn:'#e8651f',costura:'#b9470a',nombre:'naranja ají'}};
const C=TELAS[polo];
const fmt=n=>n.toFixed(1).replace('.',',');
// ---- geometría (cm). x=0 centro del polo, y=0 altura del HPS (punto alto del hombro)
const cuffO=[38,14.5], cuffI=[30.5,29];
const u=[-0.888,-0.459]; // eje de la manga hacia el hombro
const mid=[(cuffO[0]+cuffI[0])/2,(cuffO[1]+cuffI[1])/2];
const sleeveRot=-62.6;
const pt=(p,k)=>[p[0]+u[0]*k,p[1]+u[1]*k];
function silueta(){return `M-8.6 0.2 L-23 3.4 L-38 14.5 L-30.5 29 L-26 23.5 L-26.8 71 Q0 72.2 26.8 71 L26 23.5 L30.5 29 L38 14.5 L23 3.4 L8.6 0.2 Q0 2.4 -8.6 0.2 Z`;}
function bordado(file,cx,top,rot,id){ // texto de marca en ../bordado, centrado en cx, borde de arriba en top
  const m=MED[file]; const w=m[0]/10,h=m[1]/10, x=cx-w/2;
  const tr=rot?`transform="rotate(${rot} ${cx} ${top+h/2})"`:'';
  return `<g ${tr}>
   <mask id="mk${id}" style="mask-type:alpha" maskUnits="userSpaceOnUse" x="${x}" y="${top}" width="${w}" height="${h}"><image href="${B+file}-300dpi.png" x="${x}" y="${top}" width="${w}" height="${h}"/></mask>
   <image href="${B+file}-300dpi.png" x="${x}" y="${top}" width="${w}" height="${h}" filter="url(#relieve)"/>
   <rect x="${x}" y="${top}" width="${w}" height="${h}" fill="url(#puntada)" mask="url(#mk${id})" style="mix-blend-mode:soft-light"/>
  </g>`;}
// El logo original, tal cual (sin efectos, sin recortes, proporción intacta 400 x 480)
const LOGO='../bordado/logo-original-jonah-beast.png';
function logo(cx,top,alto){const w=alto*400/480;return `<image href="${LOGO}" x="${cx-w/2}" y="${top}" width="${w}" height="${alto}" preserveAspectRatio="xMidYMid meet"/>`;}
// ---- configuración de cada propuesta
const txt=polo==='crema'?'crema':'carbon';
const CFG={
 1:{nombre:'Logo en el pecho',alto:7,top:14.5,t1:'Pecho izquierdo · logo original'},
 2:{nombre:'Logo + manga',alto:9,top:13.5,manga:`manga-jonah-beast-fuel-polo-${txt}`,mangaDist:4.5,
    t1:'Pecho izquierdo · logo original',t2:'Manga izquierda · JONAH BEAST FUEL'},
 3:{nombre:'Logo + COMIDA A COMIDA',alto:8,top:14,espalda:`espalda-comida-a-comida-polo-${txt}`,
    t1:'Pecho izquierdo · logo original',t2:'Espalda bajo el cuello · COMIDA A COMIDA'}}[D];
const mp=[CFG.alto*400/480*10,CFG.alto*10];
const pechoCX=10;
document.getElementById('tit').innerHTML=`Propuesta ${D} · ${CFG.nombre} · <b>polo ${C.nombre}</b>`;
document.getElementById('sub').textContent='Mockup de referencia · polo piqué con cuello y botones · bordado · talla L';
document.getElementById('c1').innerHTML=`${CFG.t1} · <span>${fmt(mp[0]/10)} × ${fmt(mp[1]/10)} cm</span>`;
const sec=CFG.manga||CFG.espalda;
if(sec){const ms=MED[sec];document.getElementById('c2').innerHTML=`${CFG.t2} · <span>${fmt(ms[0]/10)} × ${fmt(ms[1]/10)} cm</span>`;}
else document.getElementById('c2').innerHTML='Logo original que se entrega al taller · <span>sin cambios</span>';
const HN={carbon:['#16110D','Carbón'],crema:['#F7F2E7','Crema'],aji:['#E8590C','Naranja ají']};
document.getElementById('hilos').innerHTML='Logo: colores del logo original'+(sec?' · Texto: '+(polo==='crema'?'carbón':'crema')+(CFG.manga?' + naranja ají':''):'');

function defs(){return `<defs>
 <clipPath id="cp"><path d="${silueta()}"/></clipPath>
 <filter id="b1" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation=".5"/></filter>
 <filter id="b3" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.8"/></filter>
 <filter id="drop" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.3" flood-color="#000" flood-opacity=".3"/></filter>
 <filter id="sombraCuello" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy=".18" stdDeviation=".18" flood-color="#000" flood-opacity=".45"/></filter>
 <filter id="relieve" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy=".025" stdDeviation=".02" flood-color="#000" flood-opacity=".55"/></filter>
 <pattern id="pique" width=".16" height=".16" patternUnits="userSpaceOnUse"><rect width=".16" height=".16" fill="none"/><circle cx=".04" cy=".04" r=".032" fill="#000" opacity=".22"/><circle cx=".12" cy=".12" r=".032" fill="#000" opacity=".22"/><circle cx=".12" cy=".04" r=".022" fill="#fff" opacity=".10"/></pattern>
 <pattern id="rib" width=".14" height="1" patternUnits="userSpaceOnUse"><rect width=".07" height="1" fill="#000" opacity=".22"/></pattern>
 <pattern id="puntada" width=".05" height=".05" patternUnits="userSpaceOnUse" patternTransform="rotate(38)"><rect width=".05" height=".05" fill="#808080"/><rect width=".05" height=".018" fill="#fff"/><rect y=".03" width=".05" height=".012" fill="#000"/></pattern>
 <linearGradient id="brilloHilo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".5" stop-color="#808080" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></linearGradient>
</defs>`;}

function cuerpo(vista){
  const fr=vista==='frente';
  const band=[cuffO,cuffI,pt(cuffI,2.4),pt(cuffO,2.4)];
  const bandL=band.map(p=>[-p[0],p[1]]);
  const poly=a=>a.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ')+'Z';
  let s=`<path d="${silueta()}" fill="${C.tela}" filter="url(#drop)"/>
  <g clip-path="url(#cp)">
   <rect x="-45" y="-5" width="90" height="85" fill="url(#pique)"/>
   <g opacity="${polo==='carbon'?.6:.35}" filter="url(#b3)">
    <path d="M-26 23.5 L-20 71 L-30 71Z" fill="${C.sombra}"/><path d="M26 23.5 L20 71 L30 71Z" fill="${C.sombra}"/>
    <path d="M-23 3.4 L-26 23.5 L-21.5 23Z" fill="${C.sombra}"/><path d="M23 3.4 L26 23.5 L21.5 23Z" fill="${C.sombra}"/>
   </g>
   <g opacity="${polo==='carbon'?.25:.4}" filter="url(#b3)">
    <ellipse cx="-6" cy="34" rx="8" ry="22" fill="${C.luz}"/><ellipse cx="-31" cy="15" rx="3.5" ry="6" fill="${C.luz}" transform="rotate(-30 -31 15)"/>
   </g>
   <g opacity="${polo==='carbon'?.45:.25}" filter="url(#b1)" stroke="${C.sombra}" stroke-width=".55" fill="none">
    <path d="M-15 52 Q-11 61 -13 70"/><path d="M14 55 Q10 63 12 70"/><path d="M-22 27 Q-18 32 -20 40"/><path d="M22 27 Q18 32 20 40"/>
   </g>
   <path d="${poly(band)}" fill="url(#rib)"/><path d="${poly(bandL)}" fill="url(#rib)"/>
   <g stroke="${C.costura}" stroke-width=".09" fill="none" stroke-dasharray=".35 .25">
    <path d="M23 3.4 Q24.8 13 26 23.5"/><path d="M-23 3.4 Q-24.8 13 -26 23.5"/>
    <path d="M${band[3][0]} ${band[3][1]} L${band[2][0]} ${band[2][1]}"/><path d="M${bandL[3][0]} ${bandL[3][1]} L${bandL[2][0]} ${bandL[2][1]}"/>
    <path d="M-26.7 69.4 Q0 70.6 26.7 69.4"/>
   </g>
   <g stroke="${C.sombra}" stroke-width=".12" opacity=".6"><path d="M26.4 66.5 L26.6 71"/><path d="M-26.4 66.5 L-26.6 71"/></g>`;
  if(fr){
    s+=`<rect x="-1.55" y="5" width="3.1" height="14.5" fill="${C.tela}" stroke="${C.costura}" stroke-width=".08" filter="url(#sombraCuello)"/>
    <rect x="-1.55" y="5" width="3.1" height="14.5" fill="url(#pique)"/>
    <g stroke="${C.costura}" stroke-width=".08" fill="none" stroke-dasharray=".3 .22"><rect x="-1.3" y="5" width="2.6" height="14.25"/><path d="M-1.3 18.4 L1.3 19.5"/></g>
    ${[10.8,16.2].map(y=>`<circle cx="0" cy="${y}" r=".58" fill="${C.btn}" stroke="${C.sombra}" stroke-opacity=".5" stroke-width=".06" filter="url(#sombraCuello)"/>
      ${[[-.15,-.15],[.15,-.15],[-.15,.15],[.15,.15]].map(o=>`<circle cx="${o[0]}" cy="${y+o[1]}" r=".07" fill="${C.sombra}" opacity=".7"/>`).join('')}`).join('')}`;
  }
  s+=`</g>`;
  if(fr){
    s+=`<path d="M-8.6 0.2 Q0 -2.8 8.6 0.2 L8.1 1.7 Q0 -0.9 -8.1 1.7Z" fill="${C.tela}"/><path d="M-8.6 0.2 Q0 -2.8 8.6 0.2 L8.1 1.7 Q0 -0.9 -8.1 1.7Z" fill="url(#rib)" opacity=".7"/>
    <path d="M-7.6 1.5 Q0 -0.5 7.6 1.5 Q4 5.5 0 6.8 Q-4 5.5 -7.6 1.5Z" fill="${C.int}"/>
    ${[1,-1].map(k=>`<g filter="url(#sombraCuello)"><path d="M${8.6*k} 0.2 C${9.7*k} 3 ${8.9*k} 7 ${7.4*k} 10.6 L${0.9*k} 7.1 C${3.6*k} 5.6 ${6.6*k} 3.2 ${7.5*k} 1.4 Z" fill="${C.tela}"/></g>
      <path d="M${8.6*k} 0.2 C${9.7*k} 3 ${8.9*k} 7 ${7.4*k} 10.6 L${0.9*k} 7.1 C${3.6*k} 5.6 ${6.6*k} 3.2 ${7.5*k} 1.4 Z" fill="url(#rib)" opacity=".55"/>
      <path d="M${8.15*k} 1.2 C${9*k} 3.6 ${8.3*k} 6.9 ${7.1*k} 9.8 L${1.8*k} 7" fill="none" stroke="${C.costura}" stroke-width=".07" stroke-dasharray=".28 .2"/>`).join('')}`;
  }else{
    // espalda: cuello doblado visto desde atrás
    s+=`<path d="M-8.6 0.2 Q0 -2.6 8.6 0.2 L9.2 3.6 Q0 1.0 -9.2 3.6Z" fill="${C.tela}" filter="url(#sombraCuello)"/>
    <path d="M-8.6 0.2 Q0 -2.6 8.6 0.2 L9.2 3.6 Q0 1.0 -9.2 3.6Z" fill="url(#rib)" opacity=".6"/>
    <path d="M-8.2 4.6 Q0 2.0 8.2 4.6" fill="none" stroke="${C.costura}" stroke-width=".08" stroke-dasharray=".3 .22"/>`;
  }
  return s;
}
function frente(){
  let s=cuerpo('frente');
  s+=logo(pechoCX,CFG.top,CFG.alto);
  if(CFG.manga){const m=MED[CFG.manga];const c=pt(mid,CFG.mangaDist);s+=bordado(CFG.manga,c[0],c[1]-m[1]/20,sleeveRot,'m');}
  return s;}
function espalda(){
  // vista de espalda: el pecho no se ve; "COMIDA A COMIDA" 2,5 cm bajo la costura del cuello
  let s=cuerpo('espalda');
  s+=bordado(CFG.espalda,0,4.6+2.0,0,"e");
  return s;}
const F=document.getElementById('frente');
F.setAttribute('viewBox','-40 -5 80 80');F.innerHTML=defs()+frente();
const d1=document.getElementById('d1');
const pcy=CFG.top+mp[1]/20, vw=Math.max(16,mp[1]/10*2.3), vh=vw*500/800;
d1.setAttribute('viewBox',`${pechoCX-vw/2} ${pcy-vh/2} ${vw} ${vh}`);d1.innerHTML=defs()+frente();
const d2=document.getElementById('d2');
if(CFG.manga){const c=pt(mid,4.6);const w=19,h=w*500/800;d2.setAttribute('viewBox',`${c[0]-w/2} ${c[1]-h/2} ${w} ${h}`);d2.innerHTML=defs()+`<g transform="rotate(${-sleeveRot} ${c[0]} ${c[1]})">`+frente()+'</g>';}
else if(CFG.espalda){const w=17,h=w*500/800;d2.setAttribute('viewBox',`${-w/2} ${5.5-h/2} ${w} ${h}`);d2.innerHTML=defs()+espalda();}
else{d2.setAttribute('viewBox','0 0 800 500');d2.innerHTML=`<rect width="800" height="500" fill="#E9E1D0"/><image href="${LOGO}" x="${400-200*460/480}" y="20" width="${400*460/480}" height="460"/>`;}
document.body.dataset.listo=1;
</script></body></html>
