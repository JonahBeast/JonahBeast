<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Jonah Beast Fuel — La alimentación que impulsa tu objetivo</title>
    <meta name="description" content="Mide tu composición corporal, arma tu plan de alimentación con comida peruana y sigue tu progreso día a día." />

    <!-- App instalable -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0D0D0F" />

    <!-- Iconos -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Comportamiento en iPhone al agregar a pantalla de inicio -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JB Fuel" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Capturar el evento de instalación apenas ocurre.
      // Chrome lo dispara muy temprano, antes de que cargue la app,
      // por eso hay que guardarlo aquí y no dentro de React.
      window.__jbInstall = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__jbInstall = e;
        window.dispatchEvent(new Event('jb-install-listo'));
      });
      window.addEventListener('appinstalled', function () {
        window.__jbInstall = null;
        window.dispatchEvent(new Event('jb-install-hecho'));
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
