<!doctype html>
<html lang="es-PE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Esta página no existe | Jonah Beast Fuel</title>
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;700&display=swap">
<style>
  /* Página que ve quien entra a una dirección que no existe (y Google la
     cuenta como "no existe", no como copia de la portada). */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 32px 20px; text-align: center;
    background: radial-gradient(circle at 50% 30%, #2E1102 0%, #16110D 60%);
    color: #F7F2E7; font-family: 'Work Sans', system-ui, sans-serif;
  }
  main { max-width: 420px; }
  img { width: 140px; height: auto; margin-bottom: 20px; }
  h1 { font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 40px; line-height: 1.05; text-transform: uppercase; }
  h1 span { color: #FF7020; }
  p { margin-top: 14px; font-size: 17px; line-height: 1.5; color: #E3D6BC; }
  a.boton {
    display: inline-block; margin-top: 26px; padding: 14px 32px; border-radius: 999px;
    background: #E8590C; color: #16110D; font-weight: 700; text-decoration: none; font-size: 17px;
  }
  a.boton:hover { background: #FF7020; }
  a.link { display: inline-block; margin-top: 18px; color: #F5A468; font-size: 15px; }
</style>
</head>
<body>
<main>
  <img src="/logo-marca.webp" alt="Jonah Beast Fuel">
  <h1>Esta página<br><span>no existe</span></h1>
  <p>Puede que el link esté incompleto. No pasa nada: la app te espera en la portada, comida a comida.</p>
  <a class="boton" href="/">Ir a Jonah Beast Fuel</a><br>
  <a class="link" href="/calorias">Ver las calorías de la comida peruana →</a>
</main>
</body>
</html>
